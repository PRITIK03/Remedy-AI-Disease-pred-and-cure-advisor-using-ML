[project]
name = "remedy-ai"
version = "2.0.0"
description = "Remedy-AI — cardiovascular disease risk prediction (modernized v2 ML pipeline)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pritik Kumar Mohanty" }]

dependencies = [
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "joblib>=1.4",
    "flask>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary,pool]>=3.2",
    "redis>=5",
    "pgvector>=0.3",
    "pyyaml>=6",
    "httpx>=0.27",
    "pwdlib[argon2]>=0.2",
    "email-validator>=2.0",
    "fakeredis>=2.20",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "pypdf>=5",
    "pypdfium2>=4",
    "pillow>=11",
    "python-multipart>=0.0.18",
    "mcp>=2.0",
]

[project.optional-dependencies]
ml = [
    "mlflow>=2.20",
    "shap>=0.46",
    "matplotlib>=3.9",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
# S3-compatible object storage for STORAGE_BACKEND=s3.
s3 = [
    "boto3>=1.35",
]
# Optional OpenTelemetry request tracing (OTEL_ENABLED + OTLP endpoint).
telemetry = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
# E501: line length handled by formatter
# N803/N806: X/y naming is the established ML convention
# N815: FHIR R4 mandates camelCase JSON element names (resourceType,
#       effectiveDateTime, valueQuantity, ...), so the schema field names must
#       keep the spec's casing even though Python style is snake_case.
ignore = ["E501", "N803", "N806", "N815"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
