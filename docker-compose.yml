# Remedy-AI — full local/production-shaped stack (Phase 9).
#
# Usage:
#   docker compose up -d --build          # start the whole application
#   docker compose up -d postgres redis   # infrastructure only (day-to-day dev)
#
# Credentials come from the environment / .env file (never hardcoded here and
# never baked into an image). See docs/deployment.md for the full variable
# reference and the production checklist.

services:
  postgres:
    # pgvector is required by the RAG knowledge tables; the upstream
    # postgres:18 image does not ship the extension.
    image: pgvector/pgvector:pg18
    container_name: remedy_ai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-remedy_ai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-remedy_ai}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: remedy_ai_redis
    # appendonly keeps cached metadata consistent across restarts. Sessions
    # live in Postgres, so losing Redis is not a correctness failure.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: remedy-ai-backend:latest
    container_name: remedy_ai_backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # --- Secrets: required, never given a default here --------------------
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-remedy_ai}
      REDIS_URL: redis://redis:6379/0
      # --- HTTP / cookies ---------------------------------------------------
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      HSTS_MAX_AGE_SECONDS: ${HSTS_MAX_AGE_SECONDS:-31536000}
      # --- Report storage ----------------------------------------------------
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required when STORAGE_BACKEND=s3}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
      # --- AI providers (unset => guidance / RAG degrade gracefully) ---------
      # OpenAI-compatible endpoints: OpenRouter, OpenAI, Ollama, vLLM, etc.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://openrouter.ai/api/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # --- Telemetry (inert unless an OTLP endpoint is supplied) -------------
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Only used when STORAGE_BACKEND=local (single-container deployments).
      - reports:/app/data/reports
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the browser bundle at build time (public by design).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: remedy-ai-frontend:latest
    container_name: remedy_ai_frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional S3-compatible object storage for STORAGE_BACKEND=s3. Started
  # with:  docker compose --profile storage up -d
  # For a real deployment point S3_ENDPOINT_URL at AWS S3 / R2 / B2 and leave
  # this profile off entirely.
  minio:
    image: minio/minio:latest
    container_name: remedy_ai_minio
    profiles: ["storage"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required for MinIO}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required for MinIO}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # One-shot: create the private report bucket. Anonymous access is explicitly
  # denied, so medical documents are only reachable via presigned URLs.
  minio-init:
    image: minio/mc:latest
    container_name: remedy_ai_minio_init
    profiles: ["storage"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required for MinIO}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required for MinIO}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required when STORAGE_BACKEND=s3}
    entrypoint: >
      /bin/sh -c "
      mc alias set local \"$$S3_ENDPOINT_URL\" \"$$S3_ACCESS_KEY_ID\" \"$$S3_SECRET_ACCESS_KEY\" &&
      mc mb --ignore-existing \"local/$$S3_BUCKET\" &&
      mc anonymous set none \"local/$$S3_BUCKET\"
      "
    restart: "no"

volumes:
  pgdata:
  redisdata:
  reports:
  miniodata:

